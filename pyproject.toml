[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "chinaz-top-domains"
version = "0.1.4"
description = "Unofficially collect and normalize domains from the ChinaZ website ranking"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["chinaz", "domains", "ranking", "crawler"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "filelock>=3.16,<4",
  "httpx>=0.27,<1",
  "selectolax>=0.3.21,<1",
  "tldextract>=5.1,<6",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pyinstaller>=6.16,<7",
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
chinaz-top-domains = "chinaz_top_domains.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chinaz_top_domains"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
