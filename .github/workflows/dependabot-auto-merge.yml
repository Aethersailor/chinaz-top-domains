name: Dependabot Auto Merge

on:
  workflow_run:
    workflows: [CI, CodeQL, Dependency Review]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: dependabot-auto-merge-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted automation from master
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          persist-credentials: false
      - name: Verify and merge the exact Dependabot revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REQUIRED_WORKFLOWS: CI,CodeQL,Dependency Review
        run: python tools/dependabot_automerge.py
